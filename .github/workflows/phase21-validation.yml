name: PHASE 21 Client Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - phase14-api-contracts

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter foundation validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Setup bridge Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.75.0
          components: rustfmt

      - name: Install bridge generator
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate FRB bridge
        shell: bash
        run: |
          set -euo pipefail
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          test -s ./flutter/lib/generated_bridge.dart
          test -s ./flutter/lib/generated_bridge.freezed.dart

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        working-directory: flutter
        run: flutter test

  rust-ffi:
    name: Rust and FFI validation
    runs-on: ubuntu-24.04
    env:
      VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc g++ libasound2-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm wget xvfb

      - name: Setup VCPKG
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install VCPKG dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.75.0
          components: rustfmt

      - name: Setup Flutter for bridge generation
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter dependencies for bridge generation
        working-directory: flutter
        run: flutter pub get

      - name: Install bridge generator
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate Rust bridge
        shell: bash
        run: |
          set -euo pipefail
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          test -s ./src/bridge_generated.rs

      - name: Rust check
        run: cargo check --locked --features flutter

      - name: Rust tests
        run: xvfb-run -a cargo test --locked --lib --features flutter

  compiled-artifact:
    name: PHASE 22 Linux x86_64 compiled artifact
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: "3.24.5"
      RUST_VERSION: "1.75.0"
      FRB_VERSION: "1.80.1"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libgtk-3-dev libxdo-dev libxfixes-dev libdrm-dev libegl-dev libgles2-mesa-dev libpulse-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libva-dev libxcb-randr0-dev pkg-config ninja-build nasm

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Setup pinned VCPKG
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install VCPKG dependencies
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"

      - name: Install bridge tooling and Flutter dependencies
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version "${FRB_VERSION}" --features uuid --locked
          pushd flutter
          flutter pub get
          popd

      - name: Generate official FRB bridge
        run: |
          set -euo pipefail
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          test -s ./src/bridge_generated.rs
          test -s ./flutter/lib/generated_bridge.dart

      - name: Build Rust release
        run: cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter Linux release bundle
        working-directory: flutter
        run: flutter build linux --release

      - name: Create deterministic compiled artifact archive
        run: |
          mkdir -p phase22-artifact
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C flutter/build/linux/x64/release bundle | gzip -n > phase22-artifact/rustdesk-linux-x86_64-bundle.tar.gz
          sha256sum phase22-artifact/rustdesk-linux-x86_64-bundle.tar.gz | tee phase22-artifact/SHA256SUMS
          file flutter/build/linux/x64/release/bundle/rustdesk | tee phase22-artifact/BINARY_FILE
          stat -c 'binary_size_bytes=%s' flutter/build/linux/x64/release/bundle/rustdesk | tee -a phase22-artifact/BINARY_FILE
          printf 'client_sha=%s\\nrun_id=%s\\nworkflow=%s\\nbranch=%s\\ntarget=linux-x86_64\\nflutter=%s\\nrust=%s\\nfrb=%s\\nvcpkg=%s\\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_WORKFLOW}" "${GITHUB_REF_NAME}" "${FLUTTER_VERSION}" "${RUST_VERSION}" "${FRB_VERSION}" "${VCPKG_COMMIT_ID}" > phase22-artifact/BUILD_METADATA

      - name: Upload compiled artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase22-linux-x86_64-compiled-artifact
          path: phase22-artifact
          retention-days: 14

  security:
    name: Client security and workflow checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Secret pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-' -- ':!.github/workflows/phase21-validation.yml'; then
            echo 'high-confidence secret pattern detected'
            exit 1
          fi

      - name: Workflow permission guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^permissions:$' .github/workflows/phase21-validation.yml
          grep -q '^  contents: read$' .github/workflows/phase21-validation.yml
          if git grep -n -I 'pull_request_target:' -- .github/workflows ':!.github/workflows/phase21-validation.yml'; then
            echo 'pull_request_target requires separate privileged-workflow review'
            exit 1
          fi

      - name: Setup Flutter tooling
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Setup Rust formatting toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.75.0
          components: rustfmt

      - name: Rust and Dart formatting checks
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --check src/ultimate_remote_network.rs src/ultimate_remote_adapter.rs
          dart format --output=none --set-exit-if-changed flutter/lib/foundation flutter/test/foundation
